# Search evaluation set for StarIndex.
#
# Corpus: the repositories in corpus_repos.txt (real public repositories; metadata + README + one manifest).
# Judgments: graded by hand from knowledge of what each project is. 2 = directly answers the query,
# 1 = relevant or a reasonable alternative. Repositories not listed are treated as not relevant.
# Judged repositories missing from a locally built corpus are ignored (and reported) by run_eval.py.
#
# `kind` describes the query style: nl (natural language), keyword, name (exact repository name), typo.

