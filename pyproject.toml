[project]
name = "starindex"
version = "0.1.0"
description = "Local-first AI search for your starred GitHub repositories"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "httpx>=0.27",
  "qdrant-client>=1.12",
  "fastembed>=0.5",
  "numpy>=1.26",
  "keyring>=25",
  "rapidfuzz>=3.9",
  "pyjwt[crypto]>=2.9",
  "platformdirs>=4.2",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21", "ruff>=0.6"]
sentence-transformers = ["sentence-transformers>=3"]
gpu = ["fastembed-gpu>=0.5"]

[project.scripts]
starindex = "starindex.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/starindex"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-q"
markers = ["live: needs a real model server or network", "slow: downloads or runs local models"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]
